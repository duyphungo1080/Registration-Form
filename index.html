<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jackson Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="banner">
            <h1>Jackson</h1>
            <h2>Electronics</h2>
        </div>
        <div class="title">Registration Form</div>
        <div class="subtitle">Register your Jackson Electronics product here</div>

        <form>
            <table class="form-table">
                <tr>
                    <td class="label-cell">First Name:</td>
                    <td>
                        <table style="border-collapse: collapse;">
                            <tr>
                                <td style="padding: 0;"><input type="text" style="width: 115px;"></td>
                                <td style="padding: 0 2px 0 2px; white-space: nowrap;">Last Name:</td>
                                <td style="padding: 0;"><input type="text" style="width: 105px;"></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td class="label-cell">Address #1:</td>
                    <td><input type="text" style="width: 200px;"></td>
                </tr>

                <tr>
                    <td class="label-cell">Address #2:</td>
                    <td><input type="text" style="width: 200px;"></td>
                </tr>

                <tr>
                    <td class="label-cell">City:</td>
                    <td>
                        <table style="border-collapse: collapse;">
                            <tr>
                                <td style="padding: 0;"><input type="text" style="width: 150px;"></td>
                                <td style="padding: 0 0px 0 4px;">State:</td>
                                <td style="padding: 0;"><input type="text" style="width: 40px;"></td>
                                <td style="padding: 0 1px 0 3px;">Zip:</td>
                                <td style="padding: 0;"><input type="text" style="width: 60px;"></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td class="label-cell">Country:</td>
                    <td><input type="text" value="United States" style="width: 150px;"></td>
                </tr>

                <tr>
                    <td colspan="2"><hr></td>
                </tr>

                <tr>
                    <td class="label-cell">Product:</td>
                    <td>
                        <select style="width: 110px;">
                            <option selected>ScanMaster</option>
                            <option>Bán Sếp Nhân</option>
                            <option>Bán Fortuna</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="label-cell">Date Purchased:</td>
                    <td><input type="text" style="width: 150px;"></td>
                </tr>

                <tr>
                    <td class="label-cell">Serial #:</td>
                    <td><input type="text" style="width: 150px;"></td>
                </tr>

                <tr>
                    <td class="label-cell" style="vertical-align: top; padding-top: 4px;">Used for:</td>
                    <td>
                        <table style="border-collapse: collapse;">
                            <tr>
                                <td style="vertical-align: top; width: 120px;">
                                    <label><input type="radio" name="used_for"> Home</label><br>
                                    <label><input type="radio" name="used_for" checked> Business</label><br>
                                    <label><input type="radio"name="used_for"> Government</label>
                                </td>
                                <td style="vertical-align: top;">
                                    <label><input type="radio" name="used_for"> Educational Institution</label><br>
                                    <label><input type="radio" name="used_for"> Other</label>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td class="label-cell" style="vertical-align: top; padding-top: 4px;">System (check all that apply):</td>
                    <td>
                        <table style="border-collapse: collapse;">
                            <tr>
                                <td style="vertical-align: top; width: 120px;">
                                    <label><input type="checkbox"> Windows</label><br>
                                    <label><input type="checkbox"> Macintosh</label>
                                </td>
                                <td style="vertical-align: top;">
                                    <label><input type="checkbox"> UNIX</label><br>
                                    <label><input type="checkbox"> Other</label>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="2"><hr></td>
                </tr>

                <tr>
                    <td class="label-cell" style="vertical-align: top; padding-top: 4px;">Comments?:</td>
                    <td>
                        <textarea style="width: 400px; height: 120px; resize: none;"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center; padding-top: 5px;">
                        <button type="submit">Click to register</button>
                        <button type="reset">Click to cancel</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
